name: Update build status workflow

on:
  schedule:
    # Every 5 minutes (the GitHub Actions minimum). Fork CI completion isn't
    # observable via workflow_run from the fork (the run lives in a different
    # repo), so a periodic poll is the only general-purpose mechanism to push
    # the fork run's final state onto the PR's Build commit status.
    - cron: "*/5 * * * *"
  # Fires immediately after notify_test_workflow.yml finishes for any PR
  # event. Guarantees at least one sync run per PR open/synchronize without
  # waiting for the next cron tick — important because GitHub's scheduled
  # workflows can be delayed by an hour or more after first being added.
  workflow_run:
    workflows: ["On pull request update"]
    types: [completed]
  # Manual button on the Actions tab for ad-hoc forced syncs (testing,
  # debugging, recovering from a missed cron tick).
  workflow_dispatch:

jobs:
  update:
    name: Update build status
    runs-on: ubuntu-latest
    permissions:
      actions: read
      statuses: write
    steps:
      - name: "Update build status"
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log('=== update_build_status: ' + new Date().toISOString() + ' ===')
            const statusContext = 'Build'

            // Stateless re-detection: for every open PR with an accessible
            // fork, ask the fork for its most recent fork-ci.yml run on the
            // PR's head branch, find the one matching head_sha, then write
            // a Build commit status mirroring that run's state. No state
            // is carried between ticks — if the run doesn't exist yet, we
            // leave the existing status alone and try again next tick.
            const prsIter = github.paginate.iterator(
              'GET /repos/{owner}/{repo}/pulls',
              { owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 }
            )
            let prCount = 0
            let updateCount = 0

            // Map fork run state -> commit status state.
            function runToStatusState(run) {
              if (run.status !== 'completed') return 'pending'
              if (run.conclusion === 'success') return 'success'
              if (run.conclusion === 'cancelled') return 'error'
              return 'failure'
            }

            // Find the most recent Build status for a SHA. The /statuses/{sha}
            // endpoint returns statuses in reverse chronological order; the
            // first one matching our context is the current state.
            async function getCurrentBuildStatus(sha) {
              try {
                const resp = await github.request('GET /repos/{owner}/{repo}/commits/{ref}/statuses', {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: sha,
                  per_page: 100,
                })
                return resp.data.find(s => s.context === statusContext) || null
              } catch (error) {
                console.log('  -> failed to read current Build status: ' + error.message)
                return null
              }
            }

            for await (const prs of prsIter) {
              for (const pr of prs.data) {
                prCount++
                console.log('PR #' + pr.number + ' (' + pr.head.sha.substring(0, 8) + ', mergeable_state=' + pr.mergeable_state + ')')

                if (!pr.head.repo) {
                  console.log('  head repo null; skipping')
                  continue
                }
                // In-tree PRs have no fork CI to mirror — notify_test_workflow
                // already auto-passes them on open. Don't touch their status.
                if (pr.head.repo.full_name === context.repo.owner + '/' + context.repo.repo) {
                  console.log('  in-tree PR (head repo == base repo); skipping')
                  continue
                }

                const current = await getCurrentBuildStatus(pr.head.sha)
                if (current) {
                  console.log('  current Build status: state=' + current.state + ' target_url=' + current.target_url)
                  // Don't fight notify_test_workflow's scenario decisions:
                  // if the latest Build status is a terminal failure with
                  // a non-fork target_url (blocked branch / fork inaccessible),
                  // it was set deliberately and shouldn't be overwritten by
                  // re-detection.
                  const isForkTarget = current.target_url && current.target_url.includes('/' + pr.head.repo.full_name + '/actions/runs/')
                  if (current.state === 'failure' && !isForkTarget) {
                    console.log('  -> non-fork failure target; leaving notify-set status alone')
                    continue
                  }
                  // Already terminal-success and pointing at the fork run —
                  // nothing to do.
                  if (current.state === 'success' && isForkTarget) {
                    console.log('  -> already success and linked; nothing to do')
                    continue
                  }
                }

                let runs
                try {
                  runs = await github.request(
                    'GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs',
                    {
                      owner: pr.head.repo.owner.login,
                      repo: pr.head.repo.name,
                      workflow_id: 'fork-ci.yml',
                      branch: pr.head.ref,
                      per_page: 10,
                    }
                  )
                } catch (error) {
                  console.log('  -> fork runs API error: ' + error.message + '; skipping')
                  continue
                }

                const matching = runs.data.workflow_runs.find(r => r.head_sha === pr.head.sha)
                if (!matching) {
                  console.log('  -> no fork run matches ' + pr.head.sha + ' yet; leaving status as-is')
                  continue
                }

                const actions_url = 'https://github.com/' + pr.head.repo.full_name + '/actions/runs/' + matching.id
                const newState = runToStatusState(matching)
                const description = matching.status === 'completed'
                  ? 'Fork CI run #' + matching.id + ' ' + matching.conclusion
                  : 'Fork CI run #' + matching.id + ' ' + matching.status

                // Idempotency guard — only POST if state, target_url, or
                // description actually changed. Avoids spamming the status
                // history with no-op updates every 5 minutes.
                if (current
                    && current.state === newState
                    && current.target_url === actions_url
                    && current.description === description) {
                  console.log('  -> already in sync (state=' + newState + '); nothing to do')
                  continue
                }

                try {
                  await github.rest.repos.createCommitStatus({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    sha: pr.head.sha,
                    state: newState,
                    context: statusContext,
                    description: description.slice(0, 140),
                    target_url: actions_url,
                  })
                  updateCount++
                  console.log('  -> synced: state=' + newState + ' target=' + actions_url)
                } catch (error) {
                  console.error('  -> POST status FAILED: ' + (error.status || '?') + ' ' + error.message)
                }
              }
            }
            console.log('=== done: ' + prCount + ' PRs scanned, ' + updateCount + ' Build statuses updated ===')
