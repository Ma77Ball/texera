name: Update build status workflow

on:
  schedule:
    # Every 5 minutes (the GitHub Actions minimum). Fork CI completion isn't
    # observable via workflow_run (the run lives in the fork, not here), so
    # polling is the only mechanism to push the final conclusion onto the
    # PR's Build check.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  update:
    name: Update build status
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
    steps:
      - name: "Update build status"
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log('=== update_build_status: ' + new Date().toISOString() + ' ===')

            // Iterate every open PR. We deliberately do NOT filter by
            // pr.mergeable_state here — once "Build" is a required check, any
            // PR whose Build is queued/pending has mergeable_state == "blocked",
            // and skipping those is exactly what we DON'T want.
            const prsIter = github.paginate.iterator(
              'GET /repos/{owner}/{repo}/pulls',
              { owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 }
            )
            let prCount = 0
            let updateCount = 0

            for await (const prs of prsIter) {
              for (const pr of prs.data) {
                prCount++
                console.log('PR #' + pr.number + ' (' + pr.head.sha.substring(0, 8) + ', mergeable_state=' + pr.mergeable_state + ')')
                try {
                  const checkRuns = await github.request('GET /repos/{owner}/{repo}/commits/{ref}/check-runs', {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: pr.head.sha,
                    per_page: 100,
                  })

                  // Process the most-recently-created Build check (highest id).
                  // Multiple "Build" checks can exist on the same SHA if
                  // notify_test_workflow ran more than once (reopen +
                  // synchronize on the same commit) — only the newest is
                  // surfaced on the PR, so that's the one to update.
                  checkRuns.data.check_runs.sort((a, b) => b.id - a.id)
                  console.log('  ' + checkRuns.data.check_runs.length + ' total check_runs on ' + pr.head.sha.substring(0, 8) + '; Build checks: ' +
                    checkRuns.data.check_runs.filter(c => c.name === 'Build').map(c => c.id + '(' + c.status + '/' + c.conclusion + ')').join(', ') || '(none)')

                  // Mirror each fork CI job as its own "Build / <job>" check on
                  // the PR's head SHA. Mirrors the same logic in
                  // notify_test_workflow.yml's ensureJobMirrors so jobs that
                  // didn't exist when the PR opened still get surfaced as soon
                  // as they appear in the fork run. Informational only — only
                  // the rolled-up "Build" check is in .asf.yaml's required list.
                  async function ensureJobMirrors(run, forkOwner, forkRepo, headSha) {
                    let jobs
                    try {
                      const resp = await github.request(
                        'GET /repos/{owner}/{repo}/actions/runs/{run_id}/jobs',
                        { owner: forkOwner, repo: forkRepo, run_id: run.id, per_page: 100 }
                      )
                      jobs = resp.data.jobs
                    } catch (error) {
                      console.error('    ensureJobMirrors: failed to fetch fork run jobs: ' + error.message)
                      return
                    }
                    if (jobs.length === 0) return

                    let existingChildren = []
                    try {
                      existingChildren = await github.paginate(github.rest.checks.listForRef, {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        ref: headSha,
                        per_page: 100,
                      })
                    } catch (error) {
                      console.error('    ensureJobMirrors: failed to list existing checks: ' + error.message)
                    }
                    const existingByName = new Map()
                    for (const c of existingChildren) {
                      if (!c.name.startsWith('Build / ')) continue
                      const prev = existingByName.get(c.name)
                      if (!prev || prev.id < c.id) existingByName.set(c.name, c)
                    }

                    let mirrored = 0
                    for (const job of jobs) {
                      const checkName = 'Build / ' + job.name
                      const stateLabel = job.status === 'completed'
                        ? job.status + ' / ' + job.conclusion
                        : job.status
                      const fields = {
                        external_id: String(job.id),
                        details_url: job.html_url,
                        output: {
                          title: 'Fork CI: ' + job.name + ' (' + stateLabel + ')',
                          summary:
                            ':link: **[View `' + job.name + '` logs on `' + forkOwner + '/' + forkRepo + '`](' + job.html_url + ')**\n' +
                            '\n' +
                            'Mirrors the `' + job.name + '` job from fork CI run [#' + run.id + '](https://github.com/' + forkOwner + '/' + forkRepo + '/actions/runs/' + run.id + ') for commit `' + headSha.substring(0, 8) + '`.\n',
                          text: JSON.stringify({
                            owner: forkOwner,
                            repo: forkRepo,
                            job_id: job.id,
                            run_id: run.id,
                          }),
                        },
                      }
                      fields.status = job.status === 'completed'
                        ? 'completed'
                        : (job.status === 'queued' ? 'queued' : 'in_progress')
                      if (job.status === 'completed') {
                        fields.conclusion = job.conclusion
                        if (job.started_at) fields.started_at = job.started_at
                        if (job.completed_at) fields.completed_at = job.completed_at
                      } else if (job.status === 'in_progress' && job.started_at) {
                        fields.started_at = job.started_at
                      }

                      const existing = existingByName.get(checkName)
                      // Skip redundant PATCHes when both terminal and matching.
                      if (existing &&
                          existing.status === 'completed' &&
                          fields.status === 'completed' &&
                          existing.conclusion === fields.conclusion) {
                        continue
                      }
                      try {
                        if (existing) {
                          await github.request('PATCH /repos/{owner}/{repo}/check-runs/{check_run_id}', {
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            check_run_id: existing.id,
                            ...fields,
                          })
                        } else {
                          await github.rest.checks.create({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            name: checkName,
                            head_sha: headSha,
                            ...fields,
                          })
                        }
                        mirrored++
                      } catch (error) {
                        console.error('    mirror "' + checkName + '" FAILED: ' + error.status + ' ' + error.message)
                      }
                    }
                    if (mirrored > 0) {
                      console.log('    ensureJobMirrors: ' + mirrored + '/' + jobs.length + ' Build/* checks updated')
                    }
                  }

                  // Helper: build the standard Build-check output object.
                  // Keeps title/summary in sync with notify_test_workflow.yml's
                  // detection-success path so the rendering is consistent
                  // regardless of which workflow last touched the check.
                  function buildOutput(run, runRef) {
                    const repoFull = run.repository ? run.repository.full_name : (runRef.owner + '/' + runRef.repo)
                    const url = run.html_url || ('https://github.com/' + repoFull + '/actions/runs/' + run.id)
                    const stateLabel = run.status + (run.status === 'completed' ? ' / ' + run.conclusion : '')
                    return {
                      title: 'Fork CI run #' + run.id + ' (' + stateLabel + ')',
                      summary:
                        ':link: **[View fork CI run on `' + repoFull + '`](' + url + ')**\n' +
                        '\n' +
                        'Mirroring fork-ci.yml run `#' + run.id + '` on `' + repoFull + '`. Current run state: **`' + stateLabel + '`**.\n' +
                        '\n' +
                        '| Field | Value |\n' +
                        '|---|---|\n' +
                        '| Fork repo | `' + repoFull + '` |\n' +
                        '| Run ID | [`' + run.id + '`](' + url + ') |\n' +
                        '| Status | `' + run.status + '` |\n' +
                        '| Conclusion | `' + (run.conclusion || '(pending)') + '` |\n',
                      text: JSON.stringify({ owner: runRef.owner, repo: runRef.repo, run_id: run.id }),
                    }
                  }

                  // Find the most recent Build check for this PR's head SHA.
                  // Iterates newest-first; we act on the first Build we find.
                  let buildSeen = false
                  for (const cr of checkRuns.data.check_runs) {
                    if (cr.name !== 'Build') continue
                    buildSeen = true
                    console.log('  Build check id=' + cr.id + ' status=' + cr.status + ' conclusion=' + cr.conclusion)

                    if (cr.conclusion === 'action_required') {
                      // notify_test_workflow couldn't find a matching run when
                      // the PR opened (poll race). Re-check the fork now.
                      if (!pr.head.repo) {
                        console.log('  -> head repo null; cannot recover')
                        break
                      }
                      try {
                        const forkRuns = await github.request(
                          'GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs',
                          {
                            owner: pr.head.repo.owner.login,
                            repo: pr.head.repo.name,
                            workflow_id: 'fork-ci.yml',
                            branch: pr.head.ref,
                            per_page: 5,
                          }
                        )
                        const wr = forkRuns.data.workflow_runs.find(r => r.head_sha === pr.head.sha)
                        if (!wr) {
                          console.log('  -> no fork run matches ' + pr.head.sha + '; staying action_required')
                          break
                        }
                        const actions_url = 'https://github.com/' + pr.head.repo.full_name + '/actions/runs/' + wr.id
                        const runRef = { owner: pr.head.repo.owner.login, repo: pr.head.repo.name, run_id: wr.id }
                        const patch = {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          check_run_id: cr.id,
                          external_id: String(wr.id),
                          status: wr.status === 'completed' ? 'completed' : 'in_progress',
                          details_url: actions_url,
                          output: buildOutput(wr, runRef),
                        }
                        if (wr.run_started_at) patch.started_at = wr.run_started_at
                        if (wr.status === 'completed') {
                          patch.conclusion = wr.conclusion
                          if (wr.updated_at) patch.completed_at = wr.updated_at
                        }
                        try {
                          await github.request('PATCH /repos/{owner}/{repo}/check-runs/{check_run_id}', patch)
                          updateCount++
                          console.log('  -> recovered from action_required: status=' + patch.status + (patch.conclusion ? ' conclusion=' + patch.conclusion : ''))
                        } catch (error) {
                          console.error('  -> PATCH (recovery) FAILED: ' + error.status + ' ' + error.message)
                          console.error('     payload: ' + JSON.stringify(patch))
                        }
                        // Also mirror the run's individual jobs as Build/* checks.
                        await ensureJobMirrors(wr, pr.head.repo.owner.login, pr.head.repo.name, pr.head.sha)
                      } catch (error) {
                        console.error('  -> recovery error: ' + error.message)
                      }
                      break
                    }

                    // Normal sync path: notify stored a fork run reference in
                    // output.text. Pull that run's current state and patch.
                    let runRef
                    try {
                      runRef = JSON.parse(cr.output.text)
                    } catch (error) {
                      console.log('  -> output.text not parseable; skipping')
                      break
                    }

                    let run
                    try {
                      run = await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}', runRef)
                    } catch (error) {
                      console.log('  -> fork run ' + runRef.run_id + ' not found (' + error.message + ')')
                      break
                    }

                    // Skip the redundant PATCH only when the fork run AND the
                    // local check are both terminal and agree on the
                    // conclusion. Trusting the local check alone (the previous
                    // bug) caused stale "success" displays to never refresh.
                    if (
                      run.data.status === 'completed' &&
                      cr.status === 'completed' &&
                      cr.conclusion === run.data.conclusion
                    ) {
                      console.log('  -> already in sync (terminal); nothing to do')
                      break
                    }

                    const patch = {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      check_run_id: cr.id,
                      external_id: String(run.data.id),
                      status: run.data.status === 'completed' ? 'completed' : (run.data.status === 'queued' ? 'queued' : 'in_progress'),
                      details_url: run.data.html_url,
                      output: buildOutput(run.data, runRef),
                    }
                    if (run.data.run_started_at) patch.started_at = run.data.run_started_at
                    if (run.data.status === 'completed') {
                      patch.conclusion = run.data.conclusion
                      if (run.data.updated_at) patch.completed_at = run.data.updated_at
                    }

                    try {
                      await github.request('PATCH /repos/{owner}/{repo}/check-runs/{check_run_id}', patch)
                      updateCount++
                      console.log('  -> synced: status=' + patch.status + (patch.conclusion ? ' conclusion=' + patch.conclusion : ''))
                    } catch (error) {
                      console.error('  -> PATCH (sync) FAILED: ' + error.status + ' ' + error.message)
                      console.error('     payload: ' + JSON.stringify(patch))
                    }
                    // Also mirror the run's individual jobs as Build/* checks.
                    // run.data.repository.full_name is "owner/repo" — split it.
                    {
                      const fullName = run.data.repository ? run.data.repository.full_name : (runRef.owner + '/' + runRef.repo)
                      const slash = fullName.indexOf('/')
                      const forkOwner = slash >= 0 ? fullName.substring(0, slash) : runRef.owner
                      const forkRepo = slash >= 0 ? fullName.substring(slash + 1) : runRef.repo
                      await ensureJobMirrors(run.data, forkOwner, forkRepo, pr.head.sha)
                    }

                    break
                  }
                  if (!buildSeen) {
                    console.log('  no Build check on this PR (notify_test_workflow may not have run yet)')
                  }
                } catch (error) {
                  console.error('  PR processing failed: ' + error.message)
                  console.error('     stack: ' + (error.stack || '<no stack>'))
                }
              }
            }
            console.log('=== done: ' + prCount + ' PRs scanned, ' + updateCount + ' Build checks updated ===')
