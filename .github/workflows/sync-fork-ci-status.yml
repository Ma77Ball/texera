# Sync Fork CI Status — Apache Spark model (step 3 of 3)
#
# Mirrors apache/spark's update_build_status.yml exactly.
# Runs every 15 minutes. For each open PR it finds the "Fork CI"
# check_run created by notify-fork-ci.yml, reads the fork run
# coordinates from output.text, queries the fork's Actions API,
# and patches the check_run with the current status/conclusion.
#
# Also fires immediately after notify-fork-ci.yml completes so fast
# fork runs are reflected on the PR without waiting a full 15 minutes.

name: Sync Fork CI Status

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_run:
    workflows: ['Notify Fork CI']
    types: [completed]
  workflow_dispatch:

permissions:
  checks: write
  pull-requests: read

concurrency:
  group: sync-fork-ci-status
  cancel-in-progress: true

jobs:
  update:
    name: Update fork CI status
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork run status to PR checks
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const CHECK_NAME = 'Fork CI';

            // Mirrors Spark's maybeReady list — only poll PRs that could
            // still meaningfully change state (exclude conflicting/blocked).
            const maybeReady = [
              'behind', 'clean', 'draft', 'has_hooks', 'unknown', 'unstable'
            ];

            for await (const page of github.paginate.iterator(
              github.rest.pulls.list,
              { owner, repo, state: 'open', per_page: 100 }
            )) {
              for (const pr of page.data) {
                core.info(`PR #${pr.number} — mergeable_state: ${pr.mergeable_state}`);

                if (pr.mergeable_state != null &&
                    !maybeReady.includes(pr.mergeable_state)) {
                  core.info(`  Skip: mergeable_state=${pr.mergeable_state}`);
                  continue;
                }

                // Find the Fork CI check for this PR's head SHA.
                const { data: { check_runs } } =
                  await github.rest.checks.listForRef({
                    owner, repo,
                    ref:        pr.head.sha,
                    check_name: CHECK_NAME,
                    per_page:   100,
                  });

                for (const cr of check_runs) {
                  // Skip checks that are already resolved or are the
                  // action_required/failure "no run found" placeholder.
                  if (cr.conclusion === 'action_required' ||
                      cr.conclusion === 'failure' && !cr.output?.text) {
                    core.info(`  Skip check ${cr.id}: terminal placeholder.`);
                    continue;
                  }
                  if (cr.status === 'completed') {
                    core.info(`  Skip check ${cr.id}: already completed (${cr.conclusion}).`);
                    break;
                  }

                  // Read fork run coordinates stored by notify-fork-ci.yml.
                  let params;
                  try {
                    params = JSON.parse(cr.output?.text ?? '{}');
                  } catch (err) {
                    core.warning(`  Check ${cr.id}: could not parse output.text — ${err.message}`);
                    break;
                  }

                  if (!params.run_id) {
                    core.info(`  Check ${cr.id}: no run_id in output.text, skipping.`);
                    break;
                  }

                  // Query the fork's workflow run.
                  let run;
                  try {
                    const { data } = await github.rest.actions.getWorkflowRun({
                      owner:  params.owner,
                      repo:   params.repo,
                      run_id: params.run_id,
                    });
                    run = data;
                  } catch (err) {
                    core.warning(
                      `  Check ${cr.id}: could not fetch run ${params.run_id} ` +
                      `from ${params.owner}/${params.repo} — ${err.message}`
                    );
                    break;
                  }

                  // Patch the check_run to mirror the fork run's current state.
                  if (run.status === 'completed') {
                    core.info(
                      `  Check ${cr.id}: set status=${run.status} conclusion=${run.conclusion}`
                    );
                    await github.rest.checks.update({
                      owner, repo,
                      check_run_id: cr.id,
                      status:       'completed',
                      conclusion:   run.conclusion,
                      details_url:  run.html_url,
                      output:       cr.output,
                    });
                  } else {
                    core.info(`  Check ${cr.id}: set status=${run.status}`);
                    await github.rest.checks.update({
                      owner, repo,
                      check_run_id: cr.id,
                      status:       run.status,
                      details_url:  run.html_url,
                      output:       cr.output,
                    });
                  }
                  break;
                }
              }
            }
