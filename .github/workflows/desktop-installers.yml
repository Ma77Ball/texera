name: desktop-installers

# Builds and tests the Texera control-panel installers. Each OS installer can
# only be produced on its own OS, so this fans out across runners and uploads
# one artifact per platform.

on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-installers.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Build installer
        run: npm run dist:${{ matrix.platform }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: texera-control-panel-${{ matrix.platform }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error
