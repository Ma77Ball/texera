name: windows-installer

# Builds and tests the Windows control-panel installer. The .exe can only be
# produced on Windows, so this runs on a windows runner and uploads the artifact.

on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Build installer
        run: npm run dist
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: texera-windows-installer
          path: desktop/release/TexeraSetup-*.exe
          if-no-files-found: error
