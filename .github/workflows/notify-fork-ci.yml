# Notify Fork CI — Apache Spark model (step 2 of 3)
#
# Mirrors apache/spark's notify_test_workflow.yml with one improvement:
# Spark takes the most-recent run on the branch and throws if the SHA
# doesn't match, leaving the PR with no check. We instead retry up to
# ~60s so a run that hasn't registered yet is still found, and only
# create the failure check after exhausting retries.
#
# On success this workflow creates a "Fork CI" check_run on the PR in
# apache/texera whose output.text stores the fork run coordinates as
# JSON. sync-fork-ci-status.yml reads those coordinates every 15 minutes
# to keep the check current.
#
# Security: pull_request_target runs with the base repo's token. No fork
# code is checked out or executed — only GitHub REST API calls are made.

name: Notify Fork CI

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  checks: write
  pull-requests: read

jobs:
  notify:
    name: Notify fork CI
    # Only meaningful for PRs from a fork.
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Locate fork run and create PR check
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr          = context.payload.pull_request;
            const headSha     = pr.head.sha;
            const forkOwner   = pr.head.repo.owner.login;
            const forkRepo    = pr.head.repo.name;
            const forkBranch  = pr.head.ref;
            const CHECK_NAME  = 'Fork CI';

            // Give the fork time to register the run before the first check.
            // GitHub typically takes 30-90s to start a workflow after a push.
            core.info('Waiting 60s for fork to register the workflow run…');
            await new Promise(r => setTimeout(r, 60000));

            // Search by branch name (fast — avoids full-repo SHA scan) then
            // validate the SHA against the PR head. Unlike Spark (which takes
            // runs[0] blindly and throws on mismatch), we filter for the exact
            // SHA so a stale run from a previous push is never linked.
            // Finds any status: queued, in_progress, or completed.
            // 3 attempts with 30s between each.
            const MAX_ATTEMPTS = 3;
            const RETRY_DELAY_MS = 30000;
            let forkRun = null;

            for (let i = 0; i < MAX_ATTEMPTS; i++) {
              if (i > 0) {
                core.info(`Waiting 30s before attempt ${i + 1}/${MAX_ATTEMPTS}…`);
                await new Promise(r => setTimeout(r, RETRY_DELAY_MS));
              }

              try {
                // Use listWorkflowRunsForRepo (GET /repos/{owner}/{repo}/actions/runs)
                // instead of listWorkflowRuns with workflow_id. The latter requires
                // GitHub to resolve the filename to a workflow ID, which is unreliable
                // in forks and returns nothing even when runs exist. The repo-wide
                // endpoint needs no such lookup — we filter by name ourselves.
                const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                  owner:    forkOwner,
                  repo:     forkRepo,
                  branch:   forkBranch,
                  per_page: 30,
                });
                // Log what we see so a SHA mismatch is immediately visible in logs.
                core.info(
                  `Attempt ${i + 1}: API returned ${data.workflow_runs.length} run(s). ` +
                  `Looking for SHA ${headSha}.`
                );
                for (const r of data.workflow_runs.slice(0, 5)) {
                  core.info(`  run #${r.id} name="${r.name}" sha=${r.head_sha} status=${r.status}`);
                }
                forkRun = data.workflow_runs.find(
                  r => r.name === CHECK_NAME && r.head_sha === headSha
                ) ?? null;
              } catch (err) {
                core.info(`Attempt ${i + 1}: API error — ${err.message}`);
              }

              if (forkRun) {
                core.info(
                  `Found run #${forkRun.id} (status=${forkRun.status}) ` +
                  `on attempt ${i + 1}.`
                );
                break;
              }
              core.info(
                `Attempt ${i + 1}/${MAX_ATTEMPTS}: no matching run for ` +
                `SHA ${headSha} yet.`
              );
            }

            if (forkRun) {
              const actionsUrl =
                `https://github.com/${forkOwner}/${forkRepo}/actions/runs/${forkRun.id}`;

              await github.rest.checks.create({
                owner, repo,
                name:        CHECK_NAME,
                head_sha:    headSha,
                status:      'queued',
                details_url: actionsUrl,
                output: {
                  title:   'Fork CI running',
                  summary: `[See CI results](${actionsUrl}) in \`${forkOwner}/${forkRepo}\`.\n\n` +
                           `This check updates every 15 minutes as the run progresses.`,
                  // sync-fork-ci-status.yml parses this JSON to poll the run.
                  text: JSON.stringify({
                    owner:  forkOwner,
                    repo:   forkRepo,
                    run_id: forkRun.id,
                  }),
                },
              });
              core.info(`Created Fork CI check → run #${forkRun.id}`);
            } else {
              // No matching run found after all retries — fork Actions likely
              // disabled. Mirror Spark's action_required but use failure so
              // it is a visible red X on the PR.
              const enableUrl =
                `https://github.com/${forkOwner}/${forkRepo}/actions`;

              await github.rest.checks.create({
                owner, repo,
                name:        CHECK_NAME,
                head_sha:    headSha,
                status:      'completed',
                conclusion:  'failure',
                output: {
                  title:   'Fork CI not found — action required',
                  summary: [
                    `No **Fork CI** run was found in \`${forkOwner}/${forkRepo}\``,
                    `for commit \`${headSha.slice(0, 7)}\`.`,
                    '',
                    '**Why:** GitHub Actions may be disabled in your fork, or the',
                    'branch may be out of date with upstream.',
                    '',
                    '**How to fix:**',
                    `1. Open your fork's Actions tab: ${enableUrl}`,
                    '2. Click **"I understand my workflows, go ahead and enable them"** if prompted.',
                    '3. Sync your branch with upstream and push:',
                    '   ```bash',
                    '   git fetch upstream',
                    '   git rebase upstream/main',
                    '   git push origin YOUR_BRANCH --force',
                    '   ```',
                  ].join('\n'),
                },
              });
              core.info('No fork run found — created failure check with instructions.');
            }
