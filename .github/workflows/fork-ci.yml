# Fork CI — Apache Spark model (step 1 of 3)
#
# Runs the full build matrix in the contributor's fork on every branch push.
# notify-fork-ci.yml detects this run when a PR is opened and creates a
# "Fork CI" check on the PR. sync-fork-ci-status.yml polls this run every
# 15 minutes and keeps the check current until the run completes.
#
# This workflow is a no-op in the canonical apache/texera repository —
# the job guard (github.repository_owner != 'apache') ensures it never
# consumes main-repo runner quota.
#
# Secrets (CODECOV_TOKEN, NX_CLOUD_ACCESS_TOKEN) are unavailable in forks
# and degrade gracefully: Codecov uploads are skipped (fail_ci_if_error:
# false) and NX Cloud remote caching is disabled; builds still pass.

name: Fork CI

on:
  push:
    branches-ignore:
      - 'release/**'
      - 'ci-enable/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository_owner != 'apache'
    uses: ./.github/workflows/build.yml
    with:
      run_frontend: true
      run_amber: true
      run_amber_integration: true
      run_platform: true
      run_python: true
      run_agent_service: true
    secrets: inherit
