# Intentionally has a general name.
# because the test status check created in GitHub Actions
# currently randomly picks any associated workflow.
# So, the name was changed to make sense in that context too.
# See also https://github.community/t/specify-check-suite-when-creating-a-checkrun/118380/10
name: On pull request update
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  notify:
    name: Notify test workflow
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      pull-requests: write
    steps:
      - name: "Notify test workflow"
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const name = 'Build'
            const pr = context.payload.pull_request
            const head_sha = pr.head.sha
            const head_ref = pr.head.ref
            const headRepo = pr.head.repo ? pr.head.repo.full_name : null
            const baseRepo = context.repo.owner + '/' + context.repo.repo

            console.log('=== Fork CI detection ===')
            console.log('PR #' + pr.number + ': ' + (headRepo || '<deleted>') + ':' + head_ref + ' -> ' + baseRepo + ':' + pr.base.ref)
            console.log('  head sha:  ' + head_sha)
            console.log('  event:     ' + context.payload.action)

            // ----- create the Build check up front -----------------------------
            // The Build check is GUARANTEED to exist before any scenario runs.
            // Every scenario PATCHes this same check to its terminal state.
            // Without this, any unexpected failure in a scenario branch would
            // leave the PR with no Build check at all.
            let buildCheckId = null
            try {
              const created = await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: name,
                head_sha: head_sha,
                status: 'queued',
                output: {
                  title: 'Fork CI: detecting…',
                  summary:
                    'Initializing the Build check. This will be updated in a few seconds with one of:\n' +
                    '\n' +
                    '- Link to the fork CI workflow run (success path)\n' +
                    '- Failure with troubleshooting steps (Actions disabled, run not found, blocked branch, etc.)\n',
                },
              })
              buildCheckId = created.data.id
              console.log('Created initial Build check id=' + buildCheckId)
            } catch (error) {
              console.error('FAILED to create initial Build check: ' + error.message)
              core.setFailed('Could not create Build check: ' + error.message)
              return
            }

            // ----- helpers ------------------------------------------------------

            // Post a comment once per unique marker. Idempotent across re-runs
            // of this workflow on the same PR (opened/reopened/synchronize).
            async function postOnceComment(marker, body) {
              try {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  per_page: 100,
                })
                if (comments.some(c => c.body && c.body.includes(marker))) {
                  console.log('  comment "' + marker + '" already on PR; not reposting')
                  return
                }
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: marker + '\n' + body,
                })
                console.log('  posted comment "' + marker + '"')
              } catch (error) {
                console.error('  failed to post comment "' + marker + '": ' + error.message)
              }
            }

            // Patch the up-front Build check with a terminal state. Every
            // scenario routes through one of failCheck / passCheck / linkCheck
            // so the check_run is updated in place, never recreated.
            async function patchBuildCheck(patch) {
              try {
                await github.request('PATCH /repos/{owner}/{repo}/check-runs/{check_run_id}', {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  check_run_id: buildCheckId,
                  ...patch,
                })
                console.log('  -> Build check ' + buildCheckId + ' patched: status=' + patch.status + (patch.conclusion ? ' conclusion=' + patch.conclusion : ''))
              } catch (error) {
                console.error('  -> FAILED to patch Build check ' + buildCheckId + ': ' + error.message)
                core.setFailed('Could not patch Build check: ' + error.message)
              }
            }

            async function failCheck(title, summary) {
              await patchBuildCheck({
                status: 'completed',
                conclusion: 'action_required',
                output: { title: title, summary: summary },
              })
            }

            async function passCheck(title, summary) {
              await patchBuildCheck({
                status: 'completed',
                conclusion: 'success',
                output: { title: title, summary: summary },
              })
            }

            async function linkCheck(run, runRefStr, actions_url) {
              const stateLabel = run.status === 'completed'
                ? 'completed / ' + run.conclusion
                : run.status
              const summary =
                ':link: **[View fork CI run on `' + headRepo + '`](' + actions_url + ')**\n' +
                '\n' +
                'This check mirrors the `fork-ci.yml` workflow run on `' + headRepo + ':' + head_ref + '` for commit `' + head_sha.substring(0, 8) + '`. ' +
                (run.status === 'completed'
                  ? 'The fork run has already finished — the result above is final.'
                  : 'It will advance to `in_progress` and then `completed` automatically as the fork run progresses, via the `update_build_status.yml` workflow that polls every 5 minutes.') + '\n' +
                '\n' +
                '| Field | Value |\n' +
                '|---|---|\n' +
                '| Fork repo | `' + headRepo + '` |\n' +
                '| Branch | `' + head_ref + '` |\n' +
                '| Commit | `' + head_sha + '` |\n' +
                '| Run ID | [`' + run.id + '`](' + actions_url + ') |\n' +
                '| Run status | `' + run.status + '` |\n' +
                '| Run conclusion | `' + (run.conclusion || '(pending)') + '` |\n'
              const patch = {
                external_id: String(run.id),
                details_url: actions_url,
                output: {
                  title: 'Fork CI run #' + run.id + ' (' + stateLabel + ')',
                  summary: summary,
                  text: runRefStr,
                },
              }
              if (run.status === 'completed') {
                patch.status = 'completed'
                patch.conclusion = run.conclusion
                if (run.run_started_at) patch.started_at = run.run_started_at
                if (run.updated_at) patch.completed_at = run.updated_at
              } else {
                patch.status = 'queued'
              }
              await patchBuildCheck(patch)
            }

            // ----- scenario 1: fork repo gone ----------------------------------
            if (!pr.head.repo) {
              console.log('SCENARIO: head repo is null (fork deleted, made private, or otherwise inaccessible)')
              await postOnceComment(
                '<!-- fork-ci-no-head-repo -->',
                ':no_entry: **Fork CI cannot run — your fork repository is not accessible.**\n' +
                '\n' +
                'GitHub returned `null` for this PR\'s head repository. That usually means one of:\n' +
                '\n' +
                '- The fork has been **deleted**\n' +
                '- The fork has been **made private** (Fork CI only works on public forks)\n' +
                '- The branch has been **force-removed**\n' +
                '\n' +
                'Without access to your fork, this workflow cannot detect any `fork-ci.yml` runs and the required `Build` check will stay failed.\n' +
                '\n' +
                '**To fix:** restore (or recreate) the public fork, push your branch back, then close and reopen this PR (or push a new commit) to retrigger detection.\n'
              )
              await failCheck(
                'Fork repository not accessible',
                'The PR head repository is null (deleted, private, or otherwise unreachable). Fork CI cannot be detected — see the PR conversation for recovery steps.'
              )
              return
            }

            // ----- scenario 2: non-fork PR (branch in base repo) ---------------
            if (headRepo === baseRepo) {
              console.log('SCENARIO: non-fork PR (head repo == base repo)')
              await postOnceComment(
                '<!-- fork-ci-not-applicable -->',
                ':information_source: **Fork CI is not applicable to this PR.**\n' +
                '\n' +
                'This PR is opened from a branch inside `' + baseRepo + '` itself, not from a fork. ' +
                'Fork CI is the system that runs the full build matrix in *contributor forks* and surfaces the result on PRs to `apache/texera`. ' +
                'Since there\'s no fork involved here, the `Build` check has been auto-passed.\n' +
                '\n' +
                'In-tree branches like this one are gated by the **Required Checks** status check (which runs builds directly in `' + baseRepo + '`).\n'
              )
              await passCheck(
                'Fork CI — not applicable',
                'This PR is from a branch in `' + baseRepo + '`, not a fork. Fork CI only applies to fork PRs; in-tree branches are gated by the **Required Checks** status check instead.'
              )
              return
            }

            // ----- scenario 3: blocked branch in fork --------------------------
            // These branch patterns are listed in fork-ci.yml's `branches-ignore`,
            // so no run will ever exist for them in the fork. We fail the check
            // immediately with a specific, branch-aware explanation rather than
            // burning 60s polling for a run that can't appear.
            const BLOCKED_PATTERNS = [
              {
                label: 'main',
                matches: ref => ref === 'main',
                marker: '<!-- fork-ci-blocked-main -->',
                why:
                  'Fork CI **deliberately ignores pushes to `main` in forks** (see `branches-ignore` in `.github/workflows/fork-ci.yml`).\n' +
                  '\n' +
                  'The reason: every time you sync your fork from `apache/texera` upstream, the sync pushes new commits to your fork\'s `main`. ' +
                  'Without this exclusion, every sync would burn your fork\'s GitHub Actions minutes rebuilding commits that already passed CI upstream — hundreds of minutes per week for active contributors.',
                fix:
                  '**Open this PR from a feature branch instead:**\n' +
                  '\n' +
                  '```bash\n' +
                  'git checkout -b feat/your-change\n' +
                  'git push origin feat/your-change\n' +
                  '# close this PR and open a new one from feat/your-change -> ' + baseRepo + ':' + pr.base.ref + '\n' +
                  '```\n' +
                  '\n' +
                  'See `AGENTS.md` (Branch and commit naming) for the conventional branch prefixes (`feat/`, `fix/`, `chore/`, `ci/`, `test/`).',
              },
              {
                label: 'release/**',
                matches: ref => ref.startsWith('release/'),
                marker: '<!-- fork-ci-blocked-release -->',
                why:
                  'Fork CI ignores pushes to `release/**` in forks (see `branches-ignore` in `.github/workflows/fork-ci.yml`).\n' +
                  '\n' +
                  '`release/**` branches are reserved for `apache/texera`\'s backport coordination workflow — backports are driven by `release/<version>` *labels* on PRs, not by a fork branch with that name. Running fork CI on such a branch would conflict with the canonical release pipeline.',
                fix:
                  '**Open this PR from a normal feature branch.** If you need the change backported to a release line, after the PR is open add the `release/<version>` label — `required-checks.yml` will then run the backport matrix in `apache/texera`. See `AGENTS.md` (CI labels & gating) for details.',
              },
              {
                label: 'ci-enable/**',
                matches: ref => ref.startsWith('ci-enable/'),
                marker: '<!-- fork-ci-blocked-ci-enable -->',
                why:
                  'Fork CI ignores pushes to `ci-enable/**` in forks (see `branches-ignore` in `.github/workflows/fork-ci.yml`).\n' +
                  '\n' +
                  '`ci-enable/**` is a special branch namespace **inside `apache/texera`** that committers use to run `required-checks.yml` directly on a push (without opening a PR). It\'s not a contributor branch — using it from a fork has no effect.',
                fix:
                  '**Open this PR from a normal feature branch** (`feat/...`, `fix/...`, etc.). If you\'re a committer who actually wants the `ci-enable/**` behavior, push the branch directly to `apache/texera` instead of going through a fork.',
              },
            ]

            const blocked = BLOCKED_PATTERNS.find(p => p.matches(head_ref))
            if (blocked) {
              console.log('SCENARIO: head ref "' + head_ref + '" matches blocked pattern "' + blocked.label + '"')
              await postOnceComment(
                blocked.marker,
                ':no_entry: **Fork CI cannot run on `' + head_ref + '` in your fork.**\n' +
                '\n' +
                '**Why:**\n' +
                '\n' +
                blocked.why + '\n' +
                '\n' +
                '**How to fix:**\n' +
                '\n' +
                blocked.fix + '\n' +
                '\n' +
                '---\n' +
                '\n' +
                'The required `Build` check will stay failed on this PR until you reopen it from an unblocked branch. The full `branches-ignore` list lives in `.github/workflows/fork-ci.yml`.\n'
              )
              await failCheck(
                'Fork CI is not allowed on `' + head_ref + '`',
                'Fork CI ignores pushes to `' + head_ref + '` (matches the `' + blocked.label + '` pattern in `fork-ci.yml`\'s `branches-ignore`). Open this PR from a different branch — see the PR conversation for instructions specific to `' + blocked.label + '`.'
              )
              return
            }

            // ----- scenario 4: detection ---------------------------------------
            // Poll the fork for a fork-ci.yml run matching this PR's head SHA.
            // GitHub Actions can take 10–30s+ to register a queued run, so a
            // single 3s wait misses most runs. Poll up to ~60s and search the
            // 10 most recent runs (not just the first) so a stale earlier run
            // on the same branch can't shadow the right one.
            console.log('SCENARIO: detecting fork-ci.yml run on ' + headRepo + ':' + head_ref + ' @ ' + head_sha)
            const maxAttempts = 7
            const delays = [3000, 7000, 10000, 10000, 10000, 10000, 10000]
            let matchingRun = null
            let lastSeenRuns = []

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              await new Promise(r => setTimeout(r, delays[attempt - 1]))

              let runs
              try {
                runs = await github.request(
                  'GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs',
                  {
                    owner: pr.head.repo.owner.login,
                    repo: pr.head.repo.name,
                    workflow_id: 'fork-ci.yml',
                    branch: head_ref,
                    per_page: 10,
                  }
                )
              } catch (error) {
                console.log('  attempt ' + attempt + '/' + maxAttempts + ': API error: ' + error.message)
                continue
              }

              lastSeenRuns = runs.data.workflow_runs
              console.log('  attempt ' + attempt + '/' + maxAttempts + ': ' + lastSeenRuns.length + ' fork-ci runs on ' + head_ref)
              for (const r of lastSeenRuns) {
                console.log('    run id=' + r.id + ' sha=' + r.head_sha + ' status=' + r.status + ' conclusion=' + r.conclusion)
              }

              matchingRun = lastSeenRuns.find(r => r.head_sha === head_sha)
              if (matchingRun) {
                console.log('  match: run id=' + matchingRun.id)
                break
              }
              console.log('  no run matches PR head sha ' + head_sha + ' yet')
            }

            if (!matchingRun) {
              console.log('SCENARIO: detection failed after ' + maxAttempts + ' attempts (' + lastSeenRuns.length + ' unrelated runs visible)')
              const seenSummary = lastSeenRuns.length === 0
                ? 'No `fork-ci.yml` runs on `' + head_ref + '` were visible at all — most likely cause is **GitHub Actions is disabled in your fork**.'
                : '`fork-ci.yml` runs were visible on `' + head_ref + '`, but **none of them were for commit `' + head_sha + '`**. The most likely cause is that the run for the commit you pushed hasn\'t started yet, or the workflow file in your fork is out of date.'
              await postOnceComment(
                '<!-- fork-ci-detection-failed-' + head_sha.substring(0, 8) + ' -->',
                ':warning: **Fork CI detection failed for `' + head_sha.substring(0, 8) + '`.**\n' +
                '\n' +
                seenSummary + '\n' +
                '\n' +
                '**Things to check:**\n' +
                '\n' +
                '1. **GitHub Actions enabled in your fork.** Visit the [Actions tab on `' + headRepo + '`](https://github.com/' + headRepo + '/actions) and click "I understand my workflows, go ahead and enable them" if Actions are disabled. ([docs](https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/enabling-features-for-your-repository/managing-github-actions-settings-for-a-repository))\n' +
                '2. **Your fork\'s `fork-ci.yml` is up to date.** If your fork was created before fork CI was added to `apache/texera`, sync your fork from upstream:\n' +
                '   ```bash\n' +
                '   git fetch upstream\n' +
                '   git rebase upstream/main\n' +
                '   git push origin ' + head_ref + ' --force-with-lease\n' +
                '   ```\n' +
                '3. **Retrigger detection.** After fixing the above, push an empty commit:\n' +
                '   ```bash\n' +
                '   git commit --allow-empty -m "retrigger fork CI"\n' +
                '   git push\n' +
                '   ```\n' +
                '   The `synchronize` event will re-run this detection and `update_build_status.yml` will pick up the run on its next 15-minute poll.\n'
              )
              await failCheck(
                'Fork CI run not detected for ' + head_sha.substring(0, 8),
                'Polled `' + headRepo + '` for ' + maxAttempts + ' attempts (~60s) and found no `fork-ci.yml` run matching commit `' + head_sha + '` on branch `' + head_ref + '`. ' + lastSeenRuns.length + ' unrelated runs were visible. See the PR conversation for the full troubleshooting checklist.'
              )
              return
            }

            // ----- scenario 5: detection success -------------------------------
            // Found a matching fork CI run — link the Build check to it.
            // linkCheck handles both the in-progress (status=queued, advanced
            // by update_build_status.yml) and already-completed (status=
            // completed with the run's conclusion) cases, so the committer
            // always has a clickable link to the fork CI run for review.
            const actions_url = 'https://github.com/' + headRepo + '/actions/runs/' + matchingRun.id
            const runRefStr = JSON.stringify({
              owner: pr.head.repo.owner.login,
              repo: pr.head.repo.name,
              run_id: matchingRun.id,
            })

            console.log('SCENARIO: detection success — fork run id=' + matchingRun.id + ' status=' + matchingRun.status + ' conclusion=' + matchingRun.conclusion)
            await linkCheck(matchingRun, runRefStr, actions_url)
