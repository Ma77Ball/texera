<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
    <title>Texera</title>
    <link rel="stylesheet" href="vendor/xterm.css" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f141a; --card: #171e27; --card-2: #1c2531; --ink: #e9eef4; --muted: #8795a4;
        --faint: #5b6673; --line: #273140; --teal: #19b3b0; --blue: #3b82f6;
        --grad: linear-gradient(135deg, #12b6ad, #3b82f6);
        --ok: #34d399; --warn: #fbbf24; --bad: #f87171;
        --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 24px rgba(0,0,0,0.28);
        --edge: #000000;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light; --bg: #eef1f5; --card: #ffffff; --card-2: #f6f8fb; --ink: #16202c;
          --muted: #647081; --faint: #93a0b0; --line: #e3e8ef;
          --shadow: 0 1px 2px rgba(16,24,40,0.06), 0 8px 24px rgba(16,24,40,0.08); --edge: #000000;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body { font-family: system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); overflow: hidden; border: 3px solid var(--edge); display: flex; flex-direction: column; }
      body.maximized { border-color: transparent; }

      /* titlebar */
      .titlebar { -webkit-app-region: drag; height: 44px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 15px; background: var(--card); border-bottom: 1px solid var(--line); }
      .titlebar img { height: 19px; }
      .titlebar .grow { flex: 1; }
      .winbtn { -webkit-app-region: no-drag; width: 30px; height: 30px; border: none; background: transparent; color: var(--muted); border-radius: 8px; cursor: pointer; display: grid; place-items: center; }
      .winbtn:hover { background: var(--card-2); color: var(--ink); }
      .winbtn.close:hover { background: #f05252; color: #fff; }
      .winbtn svg { display: block; }

      /* screens */
      .screen { flex: 1; min-height: 0; display: none; }
      body[data-view="home"] #home { display: flex; }
      body[data-view="explore"] #explore { display: flex; }
      body[data-view="dev"] #dev { display: flex; }

      button { font-family: inherit; font-size: 13px; font-weight: 550; padding: 9px 15px; border-radius: 10px; border: 1px solid var(--line); background: var(--card-2); color: var(--ink); cursor: pointer; transition: transform 0.08s, filter 0.12s, opacity 0.12s; }
      button:hover:not(:disabled) { filter: brightness(1.1); }
      button:active:not(:disabled) { transform: translateY(1px); }
      button:disabled { opacity: 0.4; cursor: default; }
      button.primary { border: none; background: var(--grad); color: #fff; font-weight: 650; box-shadow: 0 6px 18px rgba(59,130,246,0.32); }
      button.big { font-size: 15px; padding: 13px 26px; border-radius: 12px; }
      button.ghost.start { color: var(--teal); border-color: color-mix(in srgb, var(--teal) 55%, var(--line)); background: color-mix(in srgb, var(--teal) 10%, transparent); }
      .linkbtn { background: none; border: none; color: var(--muted); font-size: 12.5px; cursor: pointer; padding: 6px; }
      .linkbtn:hover { color: var(--ink); text-decoration: underline; }

      /* HOME */
      #home { flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 24px; overflow-y: auto; position: relative; }
      #home::before { content: ""; position: absolute; inset: 0; background: radial-gradient(700px 320px at 50% 10%, rgba(47,106,214,0.16), transparent), radial-gradient(600px 280px at 50% 10%, rgba(14,154,160,0.14), transparent); pointer-events: none; }
      .home-inner { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 540px; margin: auto; position: relative; }
      .biglogo { height: 52px; margin-bottom: 28px; }
      .light { width: 58px; height: 58px; border: none; padding: 0; border-radius: 50%; background: var(--faint); box-shadow: 0 0 0 7px color-mix(in srgb, var(--faint) 18%, transparent); margin-bottom: 20px; transition: background 0.3s, box-shadow 0.3s, transform 0.12s; display: grid; place-items: center; }
      .light svg { width: 26px; height: 26px; color: rgba(255,255,255,0.92); }
      .light.clickable { cursor: pointer; }
      .light.clickable:hover { transform: scale(1.06); }
      .light.starting svg { opacity: 0.6; }
      .light.running { background: var(--ok); box-shadow: 0 0 0 7px color-mix(in srgb, var(--ok) 24%, transparent), 0 0 22px 2px color-mix(in srgb, var(--ok) 55%, transparent); }
      .light.starting { background: var(--warn); box-shadow: 0 0 0 7px color-mix(in srgb, var(--warn) 24%, transparent); animation: pulse 1.1s infinite; }
      .light.stopped { background: var(--bad); box-shadow: 0 0 0 7px color-mix(in srgb, var(--bad) 20%, transparent); }
      @keyframes pulse { 0%,100%{ transform: scale(1); opacity: 1;} 50%{ transform: scale(0.8); opacity: 0.55;} }
      #home h1 { margin: 0 0 6px; font-size: 22px; font-weight: 650; }
      #home .sub { margin: 0 0 24px; font-size: 13.5px; color: var(--muted); max-width: 400px; }
      .home-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
      .devlink { margin-top: 20px; }

      /* shared top bar for explore/dev/logs */
      .bar { flex: none; display: flex; align-items: center; gap: 12px; padding: 11px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
      .bar b { font-size: 14px; }
      .bar .grow { flex: 1; }
      .back { background: none; border: 1px solid var(--line); color: var(--ink); padding: 7px 12px; border-radius: 9px; }

      /* EXPLORE (tabbed web views) */
      #explore { flex-direction: row; }
      .sidebar { width: 196px; flex: none; background: var(--card); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 12px 10px; gap: 4px; }
      .sidebar .shome { margin-bottom: 8px; }
      .tab { display: flex; align-items: center; gap: 11px; padding: 10px 11px; border-radius: 10px; border: none; background: transparent; color: var(--ink); cursor: pointer; text-align: left; width: 100%; }
      .tab:hover { background: var(--card-2); }
      .tab.active { background: color-mix(in srgb, var(--blue) 16%, var(--card-2)); }
      .tab .ic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; flex: none; }
      .tab .tx { min-width: 0; }
      .tab .nm { font-size: 13px; font-weight: 600; line-height: 1.15; }
      .tab .ds { font-size: 10.5px; color: var(--muted); }
      .sidebar .sfoot { margin-top: auto; }
      .openext { width: 100%; font-size: 12px; color: var(--muted); background: none; border: 1px solid var(--line); }
      .webwrap { flex: 1; min-width: 0; position: relative; background: #fff; }
      .webwrap webview { position: absolute; inset: 0; }
      .webwrap webview:not(.active) { visibility: hidden; }
      .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; background: var(--bg); z-index: 5; }
      .loading.hidden { display: none; }

      /* DEV */
      #dev { flex-direction: column; }
      .devsplit { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .devservices { flex: 1 1 auto; min-height: 90px; overflow-y: auto; padding: 18px; scrollbar-width: none; }
      .devservices::-webkit-scrollbar { display: none; }
      .termdock { flex: 0 0 46%; min-height: 150px; display: flex; flex-direction: column; border-top: 1px solid var(--line); background: #0b0f14; }
      .termtabs { flex: none; display: flex; align-items: center; gap: 4px; padding: 6px 8px; background: var(--card); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
      .termtabs::-webkit-scrollbar { display: none; }
      .termtablist { display: flex; gap: 4px; }
      .ttab { display: inline-flex; align-items: center; gap: 7px; padding: 5px 9px; border-radius: 8px; background: var(--card-2); color: var(--muted); font-size: 12px; border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
      .ttab.active { color: var(--ink); border-color: var(--line); background: var(--bg); }
      .ttab .cl { width: 15px; height: 15px; border-radius: 4px; display: grid; place-items: center; font-size: 12px; line-height: 1; }
      .ttab .cl:hover { background: #f05252; color: #fff; }
      .tbtn { background: none; border: 1px solid var(--line); color: var(--muted); font-size: 12px; padding: 5px 10px; border-radius: 8px; }
      .tbtn:hover { color: var(--ink); }
      .termhost { flex: 1; min-height: 0; position: relative; }
      .termhost .term { position: absolute; inset: 0; padding: 6px 8px; }
      .termhost .term:not(.active) { visibility: hidden; }
      .term-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--faint); font-size: 12.5px; text-align: center; padding: 20px; }
      .svc .acts { display: flex; gap: 5px; margin-left: auto; }
      .svc .sbtn { background: none; border: 1px solid var(--line); color: var(--muted); font-size: 11px; padding: 3px 8px; border-radius: 7px; }
      .svc .sbtn:hover { color: var(--ink); filter: brightness(1.15); }
      .svc .pts { font-size: 10.5px; color: var(--faint); font-family: ui-monospace, monospace; cursor: pointer; }
      .svc .pts:hover { color: var(--teal); }
      .switch { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); cursor: pointer; }
      .switch input { display: none; }
      .track { width: 34px; height: 19px; border-radius: 999px; background: var(--line); position: relative; transition: background 0.15s; }
      .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
      .switch input:checked + .track { background: var(--teal); }
      .switch input:checked + .track::after { transform: translateX(15px); }
      .banner { display: flex; align-items: center; gap: 12px; padding: 13px 15px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--bad) 45%, var(--line)); font-size: 13px; background: color-mix(in srgb, var(--bad) 10%, var(--card)); margin-bottom: 14px; }
      .banner .ic { width: 22px; height: 22px; border-radius: 50%; background: var(--bad); color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
      .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 12px; }
      .svcgroup { margin-top: 18px; } .svcgroup:first-child { margin-top: 0; }
      .grouphead { display: flex; align-items: center; gap: 10px; font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin: 0 0 9px; }
      .grouphead .count { color: var(--faint); font-weight: 600; letter-spacing: 0; }
      .grouphead .ln { flex: 1; height: 1px; background: var(--line); }
      .svcgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
      .svc { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 10px; background: var(--card-2); font-size: 13px; }
      .svc .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
      .svc .dot.ok { background: var(--ok); } .svc .dot.warn { background: var(--warn); }
      .svc .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
  </head>
  <body data-view="home">
    <div class="titlebar">
      <img src="assets/logo.png" alt="Texera" />
      <span class="grow"></span>
      <button class="winbtn" id="min" title="Minimize"><svg width="11" height="11" viewBox="0 0 11 11"><line x1="1" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.3"/></svg></button>
      <button class="winbtn" id="max" title="Maximize"><svg width="11" height="11" viewBox="0 0 11 11"><rect x="1.5" y="1.5" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
      <button class="winbtn close" id="x" title="Close"><svg width="11" height="11" viewBox="0 0 11 11"><line x1="1.7" y1="1.7" x2="9.3" y2="9.3" stroke="currentColor" stroke-width="1.4"/><line x1="9.3" y1="1.7" x2="1.7" y2="9.3" stroke="currentColor" stroke-width="1.4"/></svg></button>
    </div>

    <!-- HOME -->
    <section id="home" class="screen">
      <div class="home-inner">
        <img class="biglogo" src="assets/logo.png" alt="Texera" />
        <button id="light" class="light stopped" title="Click to start Texera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 v8"/><path d="M6.5 7.2 a8 8 0 1 0 11 0"/></svg></button>
        <h1 id="home-title">Checking...</h1>
        <p class="sub" id="home-sub">Looking for Docker.</p>
        <div class="home-actions">
          <button id="h-open" class="primary big" hidden>Open Texera</button>
          <button id="h-explore" class="big" hidden>Explore Monitoring</button>
        </div>
        <div class="devlink"><button id="to-dev" class="linkbtn">Developer view &rsaquo;</button></div>
      </div>
    </section>

    <!-- EXPLORE: sidebar tabs + embedded web views -->
    <section id="explore" class="screen">
      <div class="sidebar">
        <button id="e-home" class="back shome">&lsaquo; Home</button>
        <div id="tabs"></div>
        <div class="sfoot"><button id="e-open" class="openext">Open in browser</button></div>
      </div>
      <div class="webwrap" id="webwrap">
        <div id="web-loading" class="loading">Loading...</div>
      </div>
    </section>

    <!-- DEVELOPER -->
    <section id="dev" class="screen">
      <div class="bar">
        <button id="to-home" class="back">&lsaquo; Home</button>
        <b>Developer</b>
        <span class="grow"></span>
        <label class="switch"><input type="checkbox" id="obs" checked /><span class="track"></span> observability</label>
        <button id="d-start" class="ghost start">Start</button>
        <button id="d-stop">Stop</button>
      </div>
      <div class="devsplit">
        <div class="devservices">
          <div id="docker-banner" class="banner" hidden></div>
          <p class="label">Services</p>
          <div id="services"><div class="svc"><span class="dot"></span><span class="nm">Loading...</span></div></div>
        </div>
        <div class="termdock">
          <div class="termtabs">
            <div id="termtablist" class="termtablist"></div>
            <span class="grow"></span>
            <button id="t-new" class="tbtn">+ Terminal</button>
            <button id="t-stats" class="tbtn">Resources</button>
          </div>
          <div id="termhost" class="termhost">
            <div id="term-empty" class="term-empty">No terminal open. Use <b>+ Terminal</b>, <b>Resources</b>, or a service's Shell / Logs.</div>
          </div>
        </div>
      </div>
    </section>

    <script src="vendor/xterm.js"></script>
    <script src="vendor/addon-fit.js"></script>
    <script>
      const api = window.texera;
      const $ = id => document.getElementById(id);
      const COLORS = { texera: "#12b6ad", grafana: "#f59e0b", jaeger: "#60a5fa", parca: "#a78bfa", victoriametrics: "#ef4444" };
      let dash = [];
      let texeraUrl = null;
      const views = {};       // key -> webview element
      let currentTab = null;
      let last = { status: "stopped", dockerRunning: false };
      let busy = false;

      // The status light is the on/off switch.
      async function toggle() {
        if (busy || !last.dockerRunning || last.status === "starting") return;
        busy = true;
        try {
          if (last.status === "stopped") await api.start();
          else if (last.status === "running") await api.stop();
        } catch (e) { alert("Action failed: " + e); }
        busy = false;
        refresh();
      }

      const short = d => d.label.split(" (")[0];
      const urlFor = key => { const d = dash.find(x => x.key === key); return d ? d.url : null; };
      const tabList = () => dash.filter(d => d.key !== "texera");

      async function loadDashboards() {
        dash = await api.dashboards();
        const t = dash.find(d => d.key === "texera");
        texeraUrl = t ? t.url : null;
      }

      function buildTabs() {
        const box = $("tabs");
        box.innerHTML = "";
        for (const d of tabList()) {
          const b = document.createElement("button");
          b.className = "tab";
          b.dataset.key = d.key;
          const host = d.url.replace(/^https?:\/\//, "");
          b.innerHTML = "<span class='ic' style='background:" + (COLORS[d.key] || "#64748b") + "'>" +
            short(d)[0] + "</span><span class='tx'><span class='nm'>" + short(d) + "</span><span class='ds'>" + host + "</span></span>";
          b.onclick = () => activateTab(d.key);
          box.appendChild(b);
        }
      }

      function activateTab(key) {
        currentTab = key;
        for (const b of document.querySelectorAll(".tab")) b.classList.toggle("active", b.dataset.key === key);
        const loader = $("web-loading");
        let wv = views[key];
        if (!wv) {
          wv = document.createElement("webview");
          wv.setAttribute("src", urlFor(key));
          $("webwrap").appendChild(wv);
          loader.classList.remove("hidden");
          wv.addEventListener("did-stop-loading", () => loader.classList.add("hidden"), { once: true });
          views[key] = wv;
        } else {
          loader.classList.add("hidden");
        }
        for (const k in views) views[k].classList.toggle("active", k === key);
      }

      function openExplore() {
        document.body.dataset.view = "explore";
        if (!currentTab) {
          const first = tabList()[0];
          if (first) activateTab(first.key);
        }
      }

      // ---- terminal dock (xterm + node-pty) ----
      const terms = {};        // ptyId -> { term, fit, el, tab }
      let activeTermId = null;
      const termTheme = { background: "#0b0f14", foreground: "#d6dee7", cursor: "#19b3b0", selectionBackground: "#2b3a4f" };

      function activateTerm(id) {
        activeTermId = id;
        for (const k in terms) {
          const on = Number(k) === id;
          terms[k].el.classList.toggle("active", on);
          terms[k].tab.classList.toggle("active", on);
        }
        const t = terms[id];
        if (t) { try { t.fit.fit(); } catch {} api.ptyResize(id, t.term.cols, t.term.rows); t.term.focus(); }
      }

      function closeTerm(id) {
        const t = terms[id];
        if (!t) return;
        api.ptyKill(id);
        t.term.dispose();
        t.el.remove();
        t.tab.remove();
        delete terms[id];
        const rest = Object.keys(terms);
        if (rest.length) activateTerm(Number(rest[rest.length - 1]));
        else { activeTermId = null; $("term-empty").style.display = "grid"; }
      }

      async function newTerm(kind, service, title) {
        $("term-empty").style.display = "none";
        const el = document.createElement("div");
        el.className = "term";
        $("termhost").appendChild(el);
        const term = new Terminal({ fontSize: 12, cursorBlink: true, theme: termTheme, fontFamily: "ui-monospace, Menlo, Consolas, monospace", scrollback: 4000 });
        const fit = new FitAddon.FitAddon();
        term.loadAddon(fit);
        term.open(el);
        try { fit.fit(); } catch {}
        const id = await api.ptyCreate(kind, service || "", term.cols, term.rows);
        const tab = document.createElement("div");
        tab.className = "ttab";
        tab.innerHTML = "<span>" + title + "</span><span class='cl'>&#10005;</span>";
        tab.onclick = e => { if (e.target.classList.contains("cl")) closeTerm(id); else activateTerm(id); };
        $("termtablist").appendChild(tab);
        terms[id] = { term, fit, el, tab };
        term.onData(d => api.ptyInput(id, d));
        activateTerm(id);
      }

      function fitActive() {
        const t = terms[activeTermId];
        if (!t) return;
        try { t.fit.fit(); } catch {}
        api.ptyResize(activeTermId, t.term.cols, t.term.rows);
      }
      api.onPtyData(({ id, data }) => terms[id] && terms[id].term.write(data));
      api.onPtyExit(({ id }) => terms[id] && terms[id].term.write("\r\n\x1b[90m[process exited]\x1b[0m\r\n"));
      window.addEventListener("resize", fitActive);

      const healthClass = c => c.state !== "running" ? "" : (c.health === "starting" ? "warn" : "ok");

      function renderServices(s) {
        const box = $("services");
        // Developer list is Texera's own services; the observability stack lives in the Explore tabs.
        const items = s.containers.filter(c => c.group !== "Observability");
        if (!items.length) { box.innerHTML = "<div class='svc'><span class='dot'></span><span class='nm'>No Texera services running.</span></div>"; return; }
        box.innerHTML = "";
        const groups = {};
        for (const c of items) (groups[c.group] = groups[c.group] || []).push(c);
        const order = (s.groupOrder || []).filter(g => groups[g]).concat(Object.keys(groups).filter(g => !(s.groupOrder || []).includes(g)));
        for (const g of order) {
          const list = groups[g].sort((a, b) => (a.label || "").localeCompare(b.label || ""));
          const up = list.filter(c => c.state === "running" && c.health !== "starting").length;
          const sec = document.createElement("div");
          sec.className = "svcgroup";
          sec.innerHTML = "<div class='grouphead'><span>" + g + "</span><span class='ln'></span><span class='count'>" + up + "/" + list.length + "</span></div>";
          const grid = document.createElement("div");
          grid.className = "svcgrid";
          for (const c of list) {
            const svc = c.service || c.name;
            const label = c.label || svc;
            const el = document.createElement("div");
            el.className = "svc";
            let html = "<span class='dot " + healthClass(c) + "'></span><span class='nm'>" + label + "</span>";
            if (c.ports) html += "<span class='pts' title='Click to copy'>" + c.ports + "</span>";
            html += "<span class='acts'>" +
              "<button class='sbtn' data-a='shell'>Shell</button>" +
              "<button class='sbtn' data-a='logs'>Logs</button>" +
              "<button class='sbtn' data-a='restart'>Restart</button></span>";
            el.innerHTML = html;
            const pts = el.querySelector(".pts");
            if (pts) pts.onclick = () => api.copy(label + "  " + c.ports);
            el.querySelector("[data-a='shell']").onclick = () => newTerm("service-shell", svc, label + " sh");
            el.querySelector("[data-a='logs']").onclick = () => newTerm("logs", svc, label + " logs");
            el.querySelector("[data-a='restart']").onclick = async e => {
              const b = e.target; b.disabled = true; b.textContent = "...";
              try { await api.serviceAction(svc, "restart"); } catch (err) { alert("Restart failed: " + err); }
              b.textContent = "Restart"; b.disabled = false; refresh();
            };
            grid.appendChild(el);
          }
          sec.appendChild(grid); box.appendChild(sec);
        }
      }

      async function refresh() {
        const s = await api.state();
        $("light").className = "light " + s.status;
        const titles = { running: "Texera is running", starting: "Starting Texera", stopped: s.dockerRunning ? "Texera is stopped" : "Waiting for Docker" };
        const up = s.containers.filter(c => c.state === "running").length;
        const subs = {
          running: up + " services running. Click the light to stop, or open Texera below.",
          starting: "Services are coming up, this takes a moment.",
          stopped: s.dockerInstalled ? (s.dockerRunning ? "Click the light to start." : "Start Docker Desktop, then click the light.") : "Docker Desktop is not installed."
        };
        $("home-title").textContent = titles[s.status];
        $("home-sub").textContent = subs[s.status];
        const running = s.status === "running", starting = s.status === "starting";
        last = { status: s.status, dockerRunning: s.dockerRunning };
        $("light").classList.toggle("clickable", s.dockerRunning && !starting);
        $("light").title = !s.dockerRunning ? "Start Docker first" : running ? "Click to stop Texera" : starting ? "Starting..." : "Click to start Texera";
        $("h-open").hidden = !running;
        $("h-explore").hidden = !running;

        const banner = $("docker-banner");
        if (!s.dockerInstalled) {
          banner.hidden = false;
          banner.innerHTML = "<span class='ic'>!</span><span>Docker is not installed.</span>";
          const a = document.createElement("button"); a.className = "primary"; a.textContent = "Get Docker"; a.style.marginLeft = "auto";
          a.onclick = () => api.openDockerInstall(); banner.appendChild(a);
        } else if (!s.dockerRunning) {
          banner.hidden = false;
          banner.innerHTML = "<span class='ic'>!</span><span>Docker is installed but not running.</span>";
        } else banner.hidden = true;
        $("d-start").disabled = !s.dockerRunning || s.status !== "stopped";
        $("d-stop").disabled = !s.dockerRunning || s.status === "stopped";
        renderServices(s);
      }

      async function doStart(btn) { btn.disabled = true; try { await api.start(); } catch (e) { alert("Start failed: " + e); } refresh(); }
      async function doStop(btn) { btn.disabled = true; try { await api.stop(); } catch (e) { alert("Stop failed: " + e); } refresh(); }

      $("min").onclick = () => api.minimize();
      $("max").onclick = () => api.toggleMaximize();
      $("x").onclick = () => api.close();
      api.onWindowState(st => document.body.classList.toggle("maximized", !!st.maximized));

      $("to-dev").onclick = () => { document.body.dataset.view = "dev"; setTimeout(fitActive, 60); };
      $("to-home").onclick = () => document.body.dataset.view = "home";
      $("e-home").onclick = () => document.body.dataset.view = "home";
      $("e-open").onclick = () => { const u = urlFor(currentTab); if (u) api.open(u); };
      $("t-new").onclick = () => newTerm("shell", "", "Terminal");
      $("t-stats").onclick = () => newTerm("stats", "", "Resources");

      $("light").onclick = toggle;
      $("d-start").onclick = () => doStart($("d-start"));
      $("d-stop").onclick = () => doStop($("d-stop"));
      $("h-open").onclick = () => { if (texeraUrl) api.open(texeraUrl); };
      $("h-explore").onclick = () => openExplore();
      $("obs").onchange = e => api.setObservability(e.target.checked);

      (async () => { await loadDashboards(); buildTabs(); refresh(); setInterval(refresh, 5000); })();
    </script>
  </body>
</html>
