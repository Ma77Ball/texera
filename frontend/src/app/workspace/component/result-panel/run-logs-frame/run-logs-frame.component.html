<div class="run-logs-frame">
  <div class="run-logs-controls">
    <select
      class="run-logs-level"
      [(ngModel)]="selectedLevel"
      (change)="applyFilters()"
      aria-label="Severity filter">
      <option *ngFor="let l of levels" [value]="l">{{ l === "" ? "All levels" : l }}</option>
    </select>
    <input
      class="run-logs-search"
      type="text"
      [(ngModel)]="filterText"
      (keyup.enter)="applyFilters()"
      maxlength="256"
      placeholder="Filter (max 256 chars; matches log body)" />
    <button type="button" (click)="applyFilters()" [disabled]="loading">Apply</button>
    <span class="run-logs-total" *ngIf="!loading">{{ entries.length }} of {{ total }} shown</span>
    <span class="run-logs-total" *ngIf="loading">Loading…</span>
  </div>

  <div class="run-logs-error" *ngIf="errorMessage">{{ errorMessage }}</div>

  <div class="run-logs-empty" *ngIf="!loading && !errorMessage && entries.length === 0">
    No log entries in the current time window.
  </div>

  <ul class="run-logs-list" *ngIf="!loading && entries.length > 0">
    <li
      *ngFor="let entry of entries; trackBy: trackByEntry"
      class="run-logs-row"
      [attr.data-level]="entry.level">
      <span class="run-logs-timestamp">{{ entry.timestamp | date: "yyyy-MM-dd HH:mm:ss.SSS" }}</span>
      <span class="run-logs-level-tag">{{ entry.level }}</span>
      <!--
        Log body is rendered with text interpolation only — never bound via
        [innerHTML]. The backend strips control characters but treat as
        untrusted text on the UI side regardless.
      -->
      <span class="run-logs-body">{{ entry.body }}</span>
      <a
        class="run-logs-trace-link"
        *ngIf="traceLinkFor(entry) as href"
        [attr.href]="href"
        title="Open trace in Jaeger">
        trace
      </a>
    </li>
  </ul>
</div>
