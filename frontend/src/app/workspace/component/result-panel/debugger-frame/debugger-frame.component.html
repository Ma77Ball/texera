<div
  *ngIf="hasNoFaults()"
  class="debugger-empty">
  <h4>No paused tuples to debug.</h4>
  <p class="debugger-hint">When an operator throws on a tuple, the failing row will appear here so you can retry it.</p>
</div>

<div
  *ngFor="let entry of visibleOperators()"
  class="debugger-operator-block">
  <div class="debugger-operator-header">
    <span class="debugger-operator-name">{{ entry.operatorId }}</span>
    <button
      type="button"
      class="debugger-retry-button"
      (click)="onRetry(entry.operatorId)">
      Retry ({{ entry.faults.length }})
    </button>
  </div>

  <div
    *ngFor="let fault of entry.faults"
    class="debugger-fault-row">
    <div class="debugger-worker">{{ fault.workerName }}</div>
    <div
      *ngIf="fault.faultedTuple"
      class="debugger-tuple">
      <code>[ {{ fault.faultedTuple.tuple.join(', ') }} ]</code>
    </div>
  </div>
</div>
