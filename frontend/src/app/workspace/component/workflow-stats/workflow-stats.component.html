<div class="workflow-stats">
  <div class="workflow-stats-tiles">
    <div class="tile">
      <div class="tile-label">Failure rate (5m)</div>
      <div class="tile-value">{{ formatPercent(failureRate) }}</div>
    </div>
    <div class="tile">
      <div class="tile-label">p95 duration (5m)</div>
      <div class="tile-value">{{ formatSeconds(p95DurationSec) }}</div>
    </div>
  </div>

  <div class="workflow-stats-error" *ngIf="errorMessage">{{ errorMessage }}</div>
  <div class="workflow-stats-loading" *ngIf="loading">Loading…</div>

  <div class="workflow-stats-empty" *ngIf="!loading && !errorMessage && bars.length === 0">
    No data points in the current 7-day window.
  </div>

  <svg
    *ngIf="!loading && bars.length > 0"
    class="workflow-stats-chart"
    [attr.width]="chartWidth"
    [attr.height]="chartHeight"
    [attr.viewBox]="'0 0 ' + chartWidth + ' ' + chartHeight"
    role="img"
    aria-label="Runs per day, 7-day window">
    <g>
      <rect
        *ngFor="let bar of bars"
        [attr.x]="bar.x"
        [attr.y]="bar.y"
        [attr.width]="bar.width"
        [attr.height]="bar.height"
        class="bar"></rect>
      <text
        *ngFor="let bar of bars"
        [attr.x]="bar.x + bar.width / 2"
        [attr.y]="chartHeight - chartPadding + 14"
        text-anchor="middle"
        class="bar-label">
        <!-- Label is interpolated as text — never written into innerHTML. -->
        {{ bar.label }}
      </text>
    </g>
  </svg>
</div>
