# Prometheus runs read-only (no admin API, no lifecycle). Remote-write is
# enabled so the OTel Collector can push metrics into it; query access is
# limited to in-cluster pods via NetworkPolicy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-{{ .Values.observability.prometheus.name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-{{ .Values.observability.prometheus.name }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
    # No scrape jobs: metrics arrive via OTLP → otel-collector → remote_write.
    # If you add scrape jobs later, scope them tightly — Prometheus must not
    # scrape arbitrary cluster targets without explicit allowlisting.
    scrape_configs: []
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ .Values.observability.prometheus.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-{{ .Values.observability.prometheus.name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.observability.prometheus.port }}
      targetPort: {{ .Values.observability.prometheus.port }}
  selector:
    app: {{ .Release.Name }}-{{ .Values.observability.prometheus.name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-{{ .Values.observability.prometheus.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-{{ .Values.observability.prometheus.name }}
spec:
  serviceName: {{ .Release.Name }}-{{ .Values.observability.prometheus.name }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-{{ .Values.observability.prometheus.name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-{{ .Values.observability.prometheus.name }}
    spec:
      securityContext:
        runAsNonRoot: true
        # Prometheus image uses uid 65534 (nobody) by default.
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: {{ .Values.observability.prometheus.image }}
          imagePullPolicy: {{ .Values.observability.prometheus.imagePullPolicy }}
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time={{ .Values.observability.prometheus.retention }}"
            # Remote-write receiver: OTel Collector pushes here. The receiver
            # is HTTP-only; the only path it accepts writes on is
            # /api/v1/write. Default config blocks any other API path.
            - "--web.enable-remote-write-receiver"
            # Read-only HTTP API: admin/lifecycle endpoints stay disabled.
            - "--web.listen-address=0.0.0.0:{{ .Values.observability.prometheus.port }}"
          ports:
            - name: http
              containerPort: {{ .Values.observability.prometheus.port }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            {{- toYaml .Values.observability.prometheus.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-{{ .Values.observability.prometheus.name }}-config
        {{- if not .Values.observability.prometheus.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.observability.prometheus.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.observability.prometheus.persistence.storageClass }}
        storageClassName: {{ .Values.observability.prometheus.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.observability.prometheus.persistence.size }}
  {{- end }}
---
# Remote-write is the only mutation path; pin it to the collector. UI/query
# access stays open within the namespace so operators can curl from a
# debug pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-{{ .Values.observability.prometheus.name }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-{{ .Values.observability.prometheus.name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Release.Name }}-{{ .Values.observability.collector.name }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - port: {{ .Values.observability.prometheus.port }}
{{- end }}
