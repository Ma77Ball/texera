# Single-node OpenSearch with the security plugin **enabled**. The admin
# password is randomised on first install and stored in a Secret. Production
# operators should additionally:
#   * Replace the auto-generated self-signed transport certs with a private
#     CA they control (mount via a Secret + opensearch.yml override).
#   * Disable the bundled demo users by setting DISABLE_INSTALL_DEMO_CONFIG
#     once they have shipped their own securityconfig YAMLs.
#
# `helm.sh/resource-policy: keep` on the Secret avoids re-rolling the admin
# password (and thus orphaning the cluster) on `helm upgrade`.
{{- $adminSecretName := printf "%s-%s-admin" .Release.Name .Values.observability.opensearch.name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $adminSecretName }}
{{- $adminPassword := "" }}
{{- if $existing }}
{{- $adminPassword = index $existing.data "password" | b64dec }}
{{- else }}
{{- $adminPassword = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $adminSecretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    app: {{ .Release.Name }}-{{ .Values.observability.opensearch.name }}
type: Opaque
stringData:
  username: "admin"
  password: {{ $adminPassword | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ .Values.observability.opensearch.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-{{ .Values.observability.opensearch.name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.observability.opensearch.port }}
      targetPort: {{ .Values.observability.opensearch.port }}
    - name: transport
      port: {{ .Values.observability.opensearch.transportPort }}
      targetPort: {{ .Values.observability.opensearch.transportPort }}
  selector:
    app: {{ .Release.Name }}-{{ .Values.observability.opensearch.name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-{{ .Values.observability.opensearch.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-{{ .Values.observability.opensearch.name }}
spec:
  serviceName: {{ .Release.Name }}-{{ .Values.observability.opensearch.name }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-{{ .Values.observability.opensearch.name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-{{ .Values.observability.opensearch.name }}
    spec:
      securityContext:
        runAsNonRoot: true
        # OpenSearch image's `opensearch` user is uid 1000.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opensearch
          image: {{ .Values.observability.opensearch.image }}
          imagePullPolicy: {{ .Values.observability.opensearch.imagePullPolicy }}
          env:
            - name: cluster.name
              value: texera-observability
            - name: discovery.type
              value: single-node
            - name: bootstrap.memory_lock
              value: "false"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms{{ .Values.observability.opensearch.javaHeap }} -Xmx{{ .Values.observability.opensearch.javaHeap }}"
            # Randomised admin password — replaces the well-known demo default.
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $adminSecretName }}
                  key: password
          ports:
            - name: http
              containerPort: {{ .Values.observability.opensearch.port }}
            - name: transport
              containerPort: {{ .Values.observability.opensearch.transportPort }}
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
            # OpenSearch writes to /tmp; readOnlyRootFilesystem requires an
            # explicit emptyDir mount.
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: transport
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            {{- toYaml .Values.observability.opensearch.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if not .Values.observability.opensearch.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.observability.opensearch.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.observability.opensearch.persistence.storageClass }}
        storageClassName: {{ .Values.observability.opensearch.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.observability.opensearch.persistence.size }}
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-{{ .Values.observability.opensearch.name }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-{{ .Values.observability.opensearch.name }}
  policyTypes: [Ingress]
  ingress:
    # Writes come from the collector only.
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Release.Name }}-{{ .Values.observability.collector.name }}
      ports:
        - port: {{ .Values.observability.opensearch.port }}
    # Read access for in-namespace UI proxies (e.g. the dashboard's logs tab
    # in PR 7) on the same port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - port: {{ .Values.observability.opensearch.port }}
    # Intra-cluster transport between OpenSearch nodes (still a single node,
    # but the security plugin requires the port to be reachable from the pod
    # itself for handshake completion).
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Release.Name }}-{{ .Values.observability.opensearch.name }}
      ports:
        - port: {{ .Values.observability.opensearch.transportPort }}
{{- end }}
