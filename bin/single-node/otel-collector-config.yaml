# Compose-side mirror of the Helm-templated collector config. Kept
# hand-edited rather than templated so operators can see the full pipeline at
# a glance; if you change one side, update the other.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  basicauth/opensearch:
    client_auth:
      username: "${env:OPENSEARCH_USERNAME}"
      password: "${env:OPENSEARCH_PASSWORD}"

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true
  opensearch:
    http:
      endpoint: https://opensearch:9200
      tls:
        insecure_skip_verify: true
      auth:
        authenticator: basicauth/opensearch
    logs_index: texera-logs
  debug:
    verbosity: basic

service:
  extensions:
    - health_check
    - basicauth/opensearch
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [opensearch]
  telemetry:
    metrics:
      address: 0.0.0.0:8888
